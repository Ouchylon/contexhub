<!doctype html>
<!--
  OS Marketing Contech — tableau de bord (version 1)
  ===================================================
  Toutes les données affichées viennent de data.json (même dossier). Pour mettre à jour
  le tableau de bord, on modifie seulement data.json : le HTML ne change pas.

  Champs de data.json :
  - updated            Date/heure ISO du dernier relevé (affichée dans le pied de page).
  - today              Date ISO de référence (« aujourd'hui ») pour les tuiles et la frise.
  - seuilConfirmation  Nombre d'inscrits au-dessous ou égal duquel une formation est « non confirmée » (rouge).
  - kpis.achats        { valeur, periode, source, dernierRecu, qualiteCorrespondance } — achats suivis par le pixel Meta.
  - kpis.depensePubs[] { label, parJour ($), depuis (date ISO) } — dépenses quotidiennes des pubs actives/programmées.
  - formations         { source, releve, items[] }
      items[] = { date (ISO), titre, formateur, inscrits, max }
      Les « places à combler » = somme de (max − inscrits) sur toutes les formations listées.
  - pubs.campagnes[]   { nom, statut ("Programmée" | "Active" | "À venir" | "Terminée"), debut, fin (ISO),
                         budgetJour ($/jour) ou budgetTotal ($), objectif, ensembles[] (noms),
                         pubs (texte), utm (texte), calendrier (libellé court affiché dans la frise) }
  - pubs.reference     { nom, periode, coutParAchat ($) } — campagne de comparaison.
  - infolettres.derniers[]  { date, nom, ouverture (%), clic (%) } — derniers envois Dialog Insight.
  - infolettres.base        { contacts, nouveaux7j }
  - infolettres.sept_jours  { livraison, ouverture, clics, ctor, desabonnements } (en %)
  - infolettres.prochains[] { date, nom, statut } — le premier envoi futur alimente la tuile « Prochain envoi ».
  - calendrier         { debut, fin } — bornes (ISO) de la frise ; elle combine pubs, infolettres à venir et formations.
  - note               Texte affiché dans le pied de page.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OS Marketing Contech</title>
<style>
@font-face{font-family:Machina;src:url(fonts/machina-bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Helv;src:url(fonts/helvetica.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Helv;src:url(fonts/helvetica-bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --cream:#F7F3ED;--grid:rgb(233,230,223);--ink:#111;--yel:#E8990F;
  --blue:#86B8CE;--indigo:#5B618A;--sage:#86A397;--pink:#EF798A;--red:#B9314F;
  --mut:#5f5a52;--line:#e2dcd1;--card:#fff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.5 Helv,Helvetica,Arial,sans-serif;
  background-color:var(--cream);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:54px 54px}
.w{max-width:1160px;margin:0 auto;padding:28px 24px 56px}
h1,h2,h3{font-family:Machina,Helv,Helvetica,sans-serif;font-weight:700;margin:0;line-height:1.08;letter-spacing:-.01em}
.k{font:700 11px/1.3 Helv,Helvetica,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.o{color:var(--yel)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:34px}
header img{height:38px;width:auto;display:block;margin-bottom:18px}
header h1{font-size:clamp(30px,5vw,52px)}
.hdr-r{text-align:right}
.hdr-r .d{font-family:Machina,Helv,sans-serif;font-size:20px;margin-top:4px}

/* Sections */
section{margin-bottom:44px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sh h2{font-size:clamp(24px,3.2vw,32px)}
.sh .k{max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px}
.band{height:6px;background:var(--yel);border-radius:4px 4px 0 0}

/* Tuiles KPI */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .v{font-family:Machina,Helv,sans-serif;font-size:clamp(34px,4vw,46px);line-height:1}
.tile .v small{font-size:.45em;margin-left:4px}
.tile .s{font-size:13px;color:var(--mut);line-height:1.45}
.tile .s b{color:var(--ink)}
.pill{display:inline-block;font:700 10.5px/1 Helv,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 8px;border-radius:99px;background:#f1ece3;color:var(--ink);white-space:nowrap;max-width:100%}
.tile .pill{white-space:normal;line-height:1.25}
.tile .row{display:flex;flex-wrap:wrap;gap:6px}
.pill.y{background:var(--yel);color:#111}
.pill.r{background:var(--red);color:#fff}
.pill.b{background:var(--blue);color:#111}
.pill.i{background:var(--indigo);color:#fff}
.pill.g{background:var(--sage);color:#111}

/* Tableau formations */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .dt{white-space:nowrap;font-family:Machina,Helv,sans-serif;font-size:15px;width:92px}
.tbl .ti{font-weight:700;line-height:1.35}
.tbl .fo{color:var(--mut);font-size:13.5px}
.fill{display:flex;align-items:center;gap:10px;min-width:180px}
.bar{flex:1;height:8px;background:#efe9df;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar i.lo{background:var(--red)}
.fill .n{font-size:13.5px;white-space:nowrap;min-width:46px;text-align:right}
.fill .n.lo{color:var(--red);font-weight:700}
.tag-nc{font:700 10px/1 Helv;letter-spacing:.12em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Pubs */
.ads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ad{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ad h3{font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.ad .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.ad dt{color:var(--mut)}
.ad dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ad code{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#f4efe6;padding:2px 6px;border-radius:3px;overflow-wrap:anywhere}
.ad.soon{background:transparent;border-style:dashed;border-color:#cfc6b6}
.ref{margin-top:16px;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ref .v{font-family:Machina,Helv,sans-serif;font-size:26px}

/* Infolettres */
.nl{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.nl-list{padding:6px 0}
.nl-row{display:grid;grid-template-columns:70px minmax(0,1fr) 170px;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.nl-row:last-child{border-bottom:0}
.nl-row .dt{font-family:Machina,Helv,sans-serif;font-size:14px;white-space:nowrap}
.nl-row .nm{font-weight:700;line-height:1.35;min-width:0}
.rates{display:flex;flex-direction:column;gap:5px}
.rate{display:grid;grid-template-columns:34px 1fr 46px;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.rate .bar{height:6px}
.rate b{color:var(--ink);text-align:right;font-weight:700;white-space:nowrap}
.nl-grp{padding:14px 20px 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--mut);border-bottom:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .card{padding:18px 20px}
.big{font-family:Machina,Helv,sans-serif;font-size:36px;line-height:1;margin:8px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;margin-top:12px}
.stats div{text-align:left;min-width:0}
.stats .v{font-family:Machina,Helv,sans-serif;font-size:19px;line-height:1.1;white-space:nowrap}
.stats .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.next li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
.next ul{list-style:none;margin:8px 0 0;padding:0}
.next .dt{font-family:Machina,Helv,sans-serif;font-size:14px;min-width:62px;white-space:nowrap}
.next .nm{flex:1;font-weight:700;min-width:0}

/* Calendrier */
.cal{padding:18px 20px 16px}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.cal-grid{display:grid;position:relative;min-width:860px;row-gap:6px}
.cal-day{font-size:11px;text-align:center;color:var(--mut);padding:4px 0 6px;border-left:1px solid var(--line);line-height:1.2}
.cal-day b{display:block;font-family:Machina,Helv,sans-serif;font-size:14px;color:var(--ink)}
.cal-day.we{background:#faf7f2}
.cal-day.mon{border-left:2px solid var(--ink)}
.cal-lane{font:700 10.5px/1.2 Helv;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;padding-right:10px}
.ev{border-radius:3px;font-size:11.5px;font-weight:700;line-height:1.2;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;align-self:center}
.ev.pub{background:var(--yel);color:#111}
.ev.pub.soon{background:repeating-linear-gradient(135deg,#f6d9a8 0 6px,#f9e6c4 6px 12px);color:#111;border:1px dashed var(--yel)}
.ev.nl{background:var(--indigo);color:#fff;text-align:center;padding:6px 2px}
.fm{display:flex;flex-direction:column;gap:3px;align-items:center;align-self:start;padding-top:2px}
.fm i{width:22px;height:22px;border-radius:50%;background:var(--sage);color:#111;font:700 10px/22px Helv;text-align:center;font-style:normal;cursor:default}
.fm i.lo{background:var(--red);color:#fff}
.cal-today{font:700 10px/1 Helv;letter-spacing:.1em;text-transform:uppercase}
.cal-hint{display:none;font-size:12px;color:var(--mut);margin-top:6px}


/* Galeries (infolettres, réseaux sociaux) */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{font:700 14px Helv,sans-serif;padding:9px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gal[hidden]{display:none}
.fr{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:-6px 0 14px}
.fr b{color:var(--ink)}
.fr-d{width:8px;height:8px;border-radius:50%;background:#3a9b5c;flex:none}
.fr.ok .fr-d{box-shadow:0 0 0 3px rgba(58,155,92,.18)}
.fr.old .fr-d{background:#d08a1a}
.fr.old i{color:#b5651d;font-style:normal;font-weight:700}
.crea{margin-top:18px}
.crea .sh2{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.crea h3{font-size:19px}
.crea-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.cr{overflow:hidden;display:flex;flex-direction:column}
.cr-m{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:#efebe4}
.cr-m video,.cr-m img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;background:#111;display:block}
.cr-m video{object-fit:contain}
.cr-b{padding:12px 14px 14px}
.cr-b h4{font:700 17px/1.25 Machina,Helv,sans-serif;margin:4px 0 6px}
.cr-dest{font:700 13px Helv,sans-serif;color:var(--ink)}
.cr-t{display:block;overflow-x:auto;width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.cr-t th{font:700 9.5px Helv,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
.cr-t{table-layout:auto}.cr-t td{font-size:12.5px;padding:6px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
.cr-t td a{font-weight:700;color:var(--ink)}
.prog{margin:0 0 22px}
.prog .sh2{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.prog h3{font-size:19px}
.prog-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.pr{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.pr img{width:64px;height:80px;object-fit:cover;border-radius:4px;flex:none;background:#eee}
.pr b{display:block;font-size:14.5px;line-height:1.3;margin:3px 0 5px}
.pr-n{display:inline-block;font:700 11px/1 Helv,sans-serif;padding:4px 9px;border-radius:999px;color:#fff}
.pr-n.fb{background:#1877F2}.pr-n.li{background:#0A66C2}
.vt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.vt-perso label{font-size:13px;color:var(--mut)}
.vt-perso input{font:14px Helv,sans-serif;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
.vt-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.vt-kpis .card{padding:14px 16px}
.vt-kpis .v{font:700 28px/1.1 Machina,Helv,sans-serif;margin:6px 0 4px}
.vt-kpis .s{font-size:12.5px;color:var(--mut)}
.vt-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media(max-width:860px){.vt-grid{grid-template-columns:1fr}}
.vt-chart{padding:16px}
.vt-bars{display:flex;align-items:flex-end;gap:6px;height:190px;border-bottom:1px solid var(--line);padding-top:8px}
.vt-m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative;cursor:default}
.vt-m i{display:block;width:42%;border-radius:3px 3px 0 0}
.vt-m i.b{background:#e7e1d6}
.vt-m i.r{background:var(--yel)}
.vt-m.cur i.r{background:#111}
.vt-lab{display:flex;gap:6px;margin-top:6px}
.vt-lab span{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.vt-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;padding:6px 8px;border-radius:4px;white-space:nowrap;display:none;z-index:3;margin-bottom:6px}
.vt-m:hover .vt-tip{display:block}
.vt-list{padding:6px 0;max-height:300px;overflow:auto}
.vt-list table{width:100%;border-collapse:collapse;font-size:13.5px}
.vt-list td{padding:7px 14px;border-top:1px solid var(--line);vertical-align:top}
.vt-list td.r{text-align:right;white-space:nowrap}
.vt-list tr:first-child td{border-top:0}
.vt-list td:first-child{white-space:nowrap}
@media(max-width:480px){.vt-kpis .v{font-size:22px}}
#ventes .gnote{margin-top:10px}
.vt-empty{padding:16px;color:var(--mut);font-size:14px}
.gal.nlgal{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.gc.nl .bd{flex:0 0 auto}
.nlv{height:520px;overflow-y:auto;margin:0 14px;border:1px solid var(--line);border-radius:4px;background:#fff}
.nlv img{display:block;width:100%;height:auto}
.nlv iframe{display:block;width:100%;height:100%;border:0}
.nlwait{font-size:12.5px;color:var(--mut);padding:10px 12px;margin:0}
.nlbig{align-self:flex-start;margin:10px 14px 14px;background:none;border:0;padding:0;font:700 13px Helv,sans-serif;text-decoration:underline;cursor:pointer;color:var(--ink)}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.lbx[hidden]{display:none}
.lbx .pn{background:#fff;width:min(680px,100%);height:92vh;border-radius:6px;overflow:auto;position:relative}
.lbx .pn img{display:block;width:100%;height:auto}
.lbx .pn iframe{display:block;width:100%;height:100%;border:0}
.lbx .x{position:fixed;top:14px;right:18px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer;line-height:38px}
.gc{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gc .th{display:block;height:300px;overflow:hidden;background:#EFEFEF;border-bottom:1px solid var(--line)}
.gc .th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gc .th.sq{height:auto;aspect-ratio:1/1}
.gc .th .vide{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;color:var(--mut);padding:16px;text-align:center}
.gc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc .k{font-size:11px}
.gc h3{font:700 15px/1.3 Helv,sans-serif;margin:0}
.gc .st{font-size:13px;color:var(--mut)}
.gc .st b{color:var(--ink)}
.gc .lk{margin-top:auto;font-size:13px;font-weight:700;color:var(--ink)}
.gnote{font-size:13px;color:var(--mut);margin:0 0 12px}
.sommaire{display:flex;gap:8px;flex-wrap:wrap;margin:-14px 0 28px}
.sommaire a{font:700 13px Helv,sans-serif;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px}

footer{border-top:2px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
footer b{color:var(--ink)}
.err{padding:20px;border:1px solid var(--red);color:var(--red);background:#fff}

@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ads{grid-template-columns:1fr 1fr}
  .nl{grid-template-columns:1fr}
}
@media (max-width:700px){
  .w{padding:20px 16px 40px}
  header{margin-bottom:26px}
  .hdr-r{text-align:left}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px}
  .tile .v{font-size:32px}
  .ads{grid-template-columns:1fr}
  /* Tableau -> cartes empilées */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:10px}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{padding:0;border:0}
  .tbl .dt{grid-row:1/3;width:auto;font-size:14px;padding-top:2px}
  .tbl td.fl{grid-column:2;margin-top:8px}
  .fill{min-width:0}
  .nl-row{grid-template-columns:56px minmax(0,1fr);padding:12px 16px}
  .nl-row .rates{grid-column:2}
  .cal{padding:14px 12px}
  .cal-hint{display:block}
}
@media (max-width:380px){ .tiles{grid-template-columns:1fr} }
.pc-con{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:18px}
.pc-c{padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut)}.pc-c b{color:var(--ink);font-size:14px}.pc-c .pill{align-self:flex-start}
.pill.n{background:#f1ece4;color:var(--mut)}
.pc-vide{border:1px dashed var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);margin-bottom:18px;background:rgba(255,255,255,.5)}.pc-vide b{color:var(--ink)}
.pc-bars{padding:16px;margin:10px 0 12px}.pc-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.pc-row i{display:block;height:14px;background:var(--o,#E8990F);border-radius:2px;min-width:2px}.pc-row span{color:var(--mut);white-space:nowrap}
.pc-l{padding:14px 16px;margin-bottom:12px;min-width:0;overflow-x:auto}.pc-l small{color:var(--mut)}.pc-l .s{font-size:12.5px;color:var(--mut);line-height:1.5}
.pc-f{display:table}
.pc-sj{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

#parcours .sh2{margin-top:20px}
.gad{margin-top:22px}.gad-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:12px}
.gad-a{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}

.gad-s{font-size:12px;margin-bottom:6px}.gad-u{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.25}.gad-u small{color:#4d5156}
.gad-ic{width:26px;height:26px;border-radius:50%;border:1px solid #dadce0;background:#fff;flex:none;object-fit:cover}
.gad-t{display:block;color:#1a0dab;font-size:18px;line-height:1.3;margin:6px 0 4px;text-decoration:none}.gad-t:hover{text-decoration:underline}
.gad-p p{margin:0;font-size:14px;line-height:1.45;color:#4d5156}
.gad-a details{font-size:12.5px;color:var(--mut)}.gad-a details ul{margin:4px 0;padding-left:18px}
.gad-m{display:flex;gap:14px;font-size:12.5px;color:var(--mut)}
.gad-i{background:#f1ece4;border-radius:4px;display:grid;place-items:center;padding:10px;min-height:120px}.gad-i img{max-width:100%;max-height:340px;display:block}
.gad-x{display:block;margin-top:6px;color:#70757a;font-size:12px}.pc-l small{color:var(--mut)}
.roi{padding:18px 20px;margin-bottom:14px;border-color:var(--ink)}.roi-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}.roi-h h4{margin:0;font:700 20px Machina,Helv,sans-serif}
.roi-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.roi-c{background:#faf7f2;border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0}
.roi-c .v{font:700 26px/1.1 Machina,Helv,sans-serif;margin:6px 0 4px}.roi-c .s{font-size:12.5px;color:var(--mut);line-height:1.4}.roi-c.ok{border-color:#86A397;background:#eef3ef}.roi-c.ko{border-color:#B9314F;background:#f8ecef}
.roi-l{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:13.5px}
@media(max-width:760px){.roi-g{grid-template-columns:repeat(2,minmax(0,1fr))}.roi-c .v{font-size:19px}}
.gan{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.gan .k{display:block;margin-bottom:6px}.gan .k.ok{color:#4f7a5c}.gan .k.ko{color:#B9314F}
.gan-i{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.gan-i em{font-style:normal;font-weight:700;white-space:nowrap;text-align:right}.gan-i span{grid-column:1/-1;color:var(--mut);font-size:12.5px;line-height:1.4}
@media(max-width:760px){.gan{grid-template-columns:1fr}.gan-i em{white-space:normal}}
.vc{padding:18px 20px;margin-top:14px;min-width:0}#vc-o{overflow-x:auto}.vc .roi-h{min-width:0}.vc .cr-t{display:table;width:100%}.vc-s{margin:0 0 8px;font-size:14px}.vc-b td.vc-bar{width:32%}.vc-bar i{display:block;height:10px;background:#E8990F;border-radius:2px;min-width:2px}
.vc-p td{background:#fbf3e4}.vc-h{margin:22px 0 2px;font:700 17px Machina,Helv,sans-serif}.vc-sc{max-height:420px;overflow:auto;margin-top:8px}.vc-c small{color:var(--mut);white-space:normal}
@media(max-width:760px){.vc{padding:14px}.vc-b td.vc-bar{display:none}.vc-b th:nth-child(2){display:none}.vc-b th:nth-child(6),.vc-b td:nth-child(6){display:none}.vc-c td:nth-child(2),.vc-c th:nth-child(2){display:none}.vc .cr-t td{white-space:normal}.vc .cr-t td:nth-child(n+3){white-space:nowrap;font-size:12px}}
.st-o{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.st-c{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}.st-c b{font-size:15px;line-height:1.3}.st-c .v{font:700 20px/1.15 Machina,Helv,sans-serif;color:#b86f00}.st-c p{margin:0;font-size:13px;line-height:1.45;color:var(--mut)}
.st-a{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.st-p{padding:14px 16px;min-width:0}.st-ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:2px solid #E8990F;padding-bottom:6px}.st-ph b{font:700 17px Machina,Helv,sans-serif}.st-ph span{font-size:12px;color:var(--mut)}
.st-p ul{list-style:none;margin:6px 0 0;padding:0}.st-p li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.st-p li:last-child{border-bottom:0}
.st-q{font-size:14px;line-height:1.35;padding-left:20px;position:relative}.st-q:before{content:"";position:absolute;left:0;top:3px;width:11px;height:11px;border:1.5px solid var(--ink);border-radius:2px}
.st-w{font-size:12.5px;color:var(--mut);padding-left:20px}.st-w em{font-style:normal;font-weight:700;color:var(--ink)}
.st-t{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
#strategie .sh2{margin-top:22px}

<body>
<div class="w">
  <header>
    <div>
      <img src="logo.png" alt="Contech Bâtiment">
      <div class="k">Tableau de bord marketing</div>
      <h1>OS Marketing <span class="o">Contech</span></h1>
    </div>
    <div class="hdr-r">
      <div class="k">Aujourd'hui</div>
      <div class="d" id="today">—</div>
    </div>
  </header>

  <main id="app"><p class="k">Chargement des données…</p></main>

  <footer>
    <div>Données mises à jour le <b id="updated">—</b></div>
    <div id="note"></div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var MOIS_L=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
  var JOURS_L=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function d(iso){var p=String(iso).slice(0,10).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function hm(iso){var m=String(iso).match(/T(\d\d):(\d\d)/);if(!m)return"";return (+m[1])+" h"+(m[2]==="00"?"":" "+m[2]);}
  function fd(iso){var x=d(iso);return x.getDate()+(x.getDate()===1?"er":"")+" "+MOIS[x.getMonth()];}
  function fdj(iso){var x=d(iso);return JOURS[x.getDay()]+" "+fd(iso);}
  function nomCamp(k){var MO=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],m;
    if((m=/^hebdo_(\d\d)_(\d\d)_(\d\d)$/.exec(k)))return 'Infolettre hebdo du '+(+m[1])+' '+MO[+m[2]-1];
    if((m=/^QC_(\d\d)_(\d\d)_(\d\d)$/.exec(k)))return 'Infolettre Québec du '+(+m[1])+' '+MO[+m[2]-1];
    if((m=/^VV_(\d\d)_(\d\d)_(\d\d)$/.exec(k)))return 'Infolettre Voir vert du '+(+m[1])+' '+MO[+m[2]-1];
    if((m=/^formation(\d\d)(\d\d)(\d{4})$/.exec(k)))return 'Pub · formation du '+(+m[1])+' '+MO[+m[2]-1];
    if(k==='selectionOCT26')return 'Pub carrousel · sélection d’octobre';
    if(/^\d{12,}$/.test(k))return 'Pub Meta (campagne '+k.slice(-6)+')';
    return k;}
  function money(n){var s=(Math.round(n*100)/100).toFixed(n%1?2:0).replace(".",",");return s.replace(/\B(?=(\d{3})+(?!\d))/g," ")+" $";}
  function int(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
  function pct(n){return String(n).replace(".",",")+" %";}
  function days(a,b){return Math.round((d(b)-d(a))/864e5);}

  var SOC=null;
  fetch("social.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  .then(function(s){SOC=s;return fetch("data.json",{cache:"no-store"});})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(render).catch(function(e){
    document.getElementById("app").innerHTML='<div class="err">Impossible de charger data.json ('+esc(e.message)+').</div>';
  });

  function render(D){
    var seuil=D.seuilConfirmation==null?5:D.seuilConfirmation;
    D.today=(function(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');})();
    var t=d(D.today);
    document.getElementById("today").textContent=JOURS_L[t.getDay()]+" "+t.getDate()+" "+MOIS_L[t.getMonth()]+" "+t.getFullYear();
    var up=new Date(D.updated);
    document.getElementById("updated").textContent=isNaN(up)?D.updated:
      up.getDate()+" "+MOIS_L[up.getMonth()]+" "+up.getFullYear()+" à "+up.getHours()+" h"+(up.getMinutes()?" "+String(up.getMinutes()).padStart(2,"0"):"");
    document.getElementById("note").textContent=D.note||"";

    var F=D.formations.items.filter(function(x){return days(D.today,x.date)>=0;});
    var html="";

    /* 1. Aujourd'hui */
    var A=D.kpis.achats, dep=D.kpis.depensePubs;
    var depTot=dep.reduce(function(s,x){return s+x.parJour;},0);
    var places=F.reduce(function(s,x){return s+Math.max(0,x.max-x.inscrits);},0);
    var nc=F.filter(function(x){return x.inscrits<=seuil;}).length;
    var nxt=(D.infolettres.prochains||[]).filter(function(x){return days(D.today,x.date)>=0;})[0];
    html+='<section id="aujourdhui"><div class="sh"><h2>Aujourd’<span class="o">hui</span></h2><span class="k">Vue d’ensemble</span></div><div class="tiles">';
    if(D.ventes){var tm=D.today.slice(0,7), mi=+D.today.slice(5,7)-1, MOL=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
      var revM=D.ventes.lignes.filter(function(x){return x.date.slice(0,7)===tm;}).reduce(function(s,x){return s+x.revenus;},0), budM=D.ventes.budgetMensuel[mi]||0;
      html+='<div class="card tile"><span class="k">Revenus de '+MOL[mi]+'</span><div class="v num">'+money(revM)+'</div>'+
        '<div class="s">'+(budM?Math.round(100*revM/budM)+' % du budget du mois ('+money(budM)+')':'')+' · Coûts et revenus 2026</div>'+
        '<div class="row"><span class="pill g">Relevé '+esc(D.ventes.releve)+'</span></div></div>';}
    html+='<div class="card tile"><span class="k">Dépense pubs / jour</span><div class="v num">'+money(depTot)+'</div><div class="s">'+
      dep.map(function(x){return '<b>'+money(x.parJour)+'</b> '+esc(x.label)+(x.depuis?' (dès le '+fd(x.depuis)+')':'');}).join('<br>')+'</div></div>';
    html+='<div class="card tile"><span class="k">Prochaine infolettre</span>'+(nxt?
      '<div class="v">'+fd(nxt.date)+'</div><div class="s"><b>'+esc(nxt.nom)+'</b><br>'+JOURS_L[d(nxt.date).getDay()]+' · '+esc(nxt.statut||"")+'</div>':'<div class="s">Aucun envoi prévu</div>')+'</div>';
    html+='<div class="card tile"><span class="k">Places à combler</span><div class="v num">'+int(places)+'</div><div class="s">'+F.length+' formations, '+
      fd(F[0].date)+' → '+fd(F[F.length-1].date)+'<br><b style="color:var(--red)">'+nc+' non confirmées</b> (≤ '+seuil+' inscrits)</div></div>';
    html+='</div></section>';

    /* 1a. Stratégie */
    if(D.strategie){var ST=D.strategie;
      html+='<section id="strategie"><div class="sh"><h2><span class="o">Stratégie</span></h2><span class="k">Ce que disent les chiffres · qui fait quoi · relevé '+esc(ST.releve)+'</span></div>'+
        '<div class="st-o">'+ST.observations.map(function(o,i){return '<div class="card st-c"><span class="k">'+(i+1)+' · '+esc(o.source)+'</span><b>'+esc(o.titre)+'</b><div class="v">'+esc(o.chiffre)+'</div><p>'+esc(o.texte)+'</p></div>';}).join('')+'</div>'+
        '<div class="sh2"><h3>Prochaines actions marketing</h3><span class="k">Ce que le marketing fait à partir de ces chiffres</span></div><div class="st-a">'+
        ST.actions.map(function(a){return '<div class="card st-p"><div class="st-ph"><b>'+esc(a.qui)+'</b><span>'+esc(a.role)+'</span></div><ul>'+a.items.map(function(x){return '<li><span class="st-q">'+esc(x.quoi)+'</span><span class="st-w"><em>'+esc(x.quand)+'</em> · '+esc(x.pourquoi)+'</span></li>';}).join('')+'</ul></div>';}).join('')+'</div>'+
        '<div class="sh2"><h3>Tests à lancer</h3><span class="k">Petits essais, résultat mesuré dans ce tableau</span></div><div class="st-t">'+
        ST.tests.map(function(t){return '<div class="card st-c"><b>'+esc(t.titre)+'</b><p>'+esc(t.texte)+'</p><span class="k">Mesure : '+esc(t.mesure)+'</span></div>';}).join('')+'</div></section>';}

    /* 1b. Ventes */
    if(D.ventes){
      html+='<section id="ventes"><div class="sh"><h2>Ventes <span class="o">formations</span></h2><span class="k">Source : '+esc(D.ventes.source)+' · relevé le '+esc(D.ventes.releve)+'</span></div>'+
        '<div class="vt-bar"><div class="tabs vt-per">'+[["sem","Cette semaine"],["sem-1","Semaine passée"],["mois","Ce mois"],["mois-1","Mois passé"],["annee","Année 2026"],["perso","Période…"]].map(function(a,i){return '<button type="button" data-p="'+a[0]+'"'+(a[0]==="mois"?' class="on"':'')+'>'+a[1]+'</button>';}).join('')+'</div>'+
        '<span class="vt-perso" hidden><label>Du <input type="date" id="vt-du" value="2026-11-01"></label> <label>au <input type="date" id="vt-au" value="2026-11-30"></label></span></div>'+
        '<div id="vt-out"></div><p class="gnote">'+esc(D.ventes.note)+'</p>'+
        (D.ventesCanaux?'<div class="card vc"><div class="roi-h"><h4>D’où viennent les ventes</h4><div class="tabs vc-t">'+D.ventesCanaux.periodes.map(function(p,i){return '<button type="button" data-i="'+i+'"'+(i===0?' class="on"':'')+'>'+esc(p.label)+'</button>';}).join('')+'</div></div><div id="vc-o"></div>'+
          '<h4 class="vc-h">Ventes par campagne (infolettres et pubs)</h4><span class="k">Depuis le 14 janv. · chaque ligne = un envoi ou une pub, avec les ventes qu’elle a amenées</span><div class="vc-sc"><table class="cr-t vc-c"><tr><th>Campagne</th><th>Canal</th><th>Ventes</th><th>Montant</th><th>Payé</th></tr>'+
          D.ventesCanaux.campagnes.map(function(c){return '<tr><td><b>'+esc(nomCamp(c.campagne))+'</b>'+(c.note?'<br><small>'+esc(c.note)+'</small>':'')+'</td><td>'+esc(c.canal)+'</td><td>'+int(c.commandes)+'</td><td><b>'+money(c.ventes)+'</b></td><td>'+(c.paye!=null?money(c.paye):'—')+'</td></tr>';}).join('')+'</table></div>'+
          '<p class="gnote">'+esc(D.ventesCanaux.source)+' Relevé '+esc(D.ventesCanaux.releve)+'.</p></div>':'')+'</section>';
    }

    /* 1c. Parcours client */
    (function(){
      var PA=D.parcours, G=D.ga4, S=D.gsc, CT=D.contenus||{centres:[]};
      var ORD=["Meta (pub)","Google Ads","Courriel","LinkedIn (pub)","Recherche Google (SEO)","IA (ChatGPT, etc.)","Réseaux sociaux (organique)","Sites référents","Direct / inconnu"];
      function pct(a,b){return b?Math.round(100*a/b)+' %':'—';}
      function attente(txt){return '<div class="pc-vide"><b>Se remplit tout seul une fois branché</b><span>'+txt+'</span></div>';}
      var con=[
        ["Dialog Insight","Infolettres : envois, ouvertures, clics",!!(D.infolettres&&D.infolettres.releve)],
        ["Shopify · commandes","Ventes encaissées et parcours de chaque achat (première et dernière visite)",!!(D.shopify||PA)],
        ["Meta","Pubs : portée, clics, visites, paniers, achats",!!D.meta],
        ["Google Analytics 4","Visites par canal, entonnoir, Google Ads, visites venues des IA",!!G],
        ["Search Console","Mots tapés dans Google pour nous trouver",!!S],
        ["Pixel Meta de la boutique","Ajouts au panier et achats suivis par les pubs",true]];
      var h='<section id="parcours"><div class="sh"><h2>Parcours <span class="o">client</span></h2><span class="k">D’où viennent les inscriptions · ce qu’on cherche pour nous trouver</span></div>'+
        '<div class="pc-con">'+con.map(function(c){return '<div class="card pc-c"><span class="pill '+(c[2]?'g':'n')+'">'+(c[2]?'Branché':'À brancher')+'</span><b>'+c[0]+'</b><span>'+c[1]+'</span></div>';}).join('')+'</div>';

      /* A. Canal d'arrivée des inscriptions */
      h+='<div class="sh2"><h3>D’où arrivent les acheteurs</h3><span class="k">'+(PA?'Shopify · '+int(PA.commandes)+' commandes payées depuis le '+fd(PA.depuis):'Source : Shopify (parcours de chaque commande)')+'</span></div>';
      if(PA){
        h+='<div class="tabs pc-tog"><button type="button" class="on" data-v="derniereVisite">Dernière visite avant l’achat</button><button type="button" data-v="premiereVisite">Première visite</button></div><div class="card pc-bars" id="pc-bars"></div>'+
          '<div class="vt-kpis">'+
          '<div class="card"><span class="k">Délai médian</span><div class="v">'+(PA.delaiMedianJours==null?'—':PA.delaiMedianJours+' j')+'</div><div class="s">entre la première visite et l’achat</div></div>'+
          '<div class="card"><span class="k">Visites médianes</span><div class="v">'+(PA.visitesMedianes==null?'—':PA.visitesMedianes)+'</div><div class="s">avant d’acheter</div></div>'+
          '<div class="card"><span class="k">Sans parcours</span><div class="v">'+int(PA.sansParcours)+'</div><div class="s">commandes sans source (ex. entrées à la main)</div></div></div>'+
          '<div class="vt-grid"><div class="card pc-l"><span class="k">Campagnes qui mènent à l’achat (utm_campaign)</span>'+(PA.campagnes.length?'<table class="cr-t">'+PA.campagnes.map(function(c){return '<tr><td>'+esc(c.campagne)+'</td><td>'+esc(c.canal)+'</td><td><b>'+int(c.commandes)+'</b></td></tr>';}).join('')+'</table>':'<p class="s">Aucune campagne nommée.</p>')+'</div>'+
          '<div class="card pc-l"><span class="k">Pages d’arrivée des acheteurs</span><table class="cr-t">'+PA.pagesArrivee.map(function(c){return '<tr><td>'+esc(c.page)+'</td><td><b>'+int(c.commandes)+'</b></td></tr>';}).join('')+'</table></div></div>';
      } else h+=attente('Avec l’accès en lecture aux commandes Shopify, chaque inscription est rattachée à son canal : '+ORD.join(', ')+'.');

      /* B. Entonnoir par canal (GA4) */
      h+='<div class="sh2"><h3>Entonnoir par canal</h3><span class="k">'+(G?'Google Analytics 4 · '+esc(G.periode):'Source : Google Analytics 4')+'</span></div>';

          return '<div class="prog"><div class="sh2"><h3>Posts programmés</h3><span class="k">'+P.length+' à venir · relevé '+esc(SOC.programmes_releve||'')+'</span></div><div class="prog-l">'+
          P.map(function(x){var t=new Date(x.quand);var h=t.getHours()+' h'+(t.getMinutes()?String(t.getMinutes()).padStart(2,'0'):'');
            return '<div class="pr"><img src="'+esc(x.img)+'" alt=""><div><span class="k">'+JR[t.getDay()]+' '+t.getDate()+' '+MO[t.getMonth()]+' · '+h+'</span><b>'+esc(x.titre)+'</b><span class="pr-n '+(x.reseau==='Facebook'?'fb':'li')+'">'+esc(x.reseau)+' · '+esc(x.type)+'</span></div></div>';}).join('')+'</div></div>';})()+
        '<p class="gnote">Cliquez sur une image pour ouvrir la vraie publication : les réactions et les commentaires y sont à jour. Facebook et LinkedIn peuvent demander d’être connecté.</p>'+
        '<div class="tabs" data-g="soc"><button class="on" data-t="soc-fb">Facebook ('+FB.length+')</button><button data-t="soc-li">LinkedIn ('+LI.length+')</button></div>'+
        '<div class="gal" id="soc-fb">'+FB.map(function(x){return pcard(x,'Facebook');}).join('')+'</div>'+
        '<div class="gal" id="soc-li" hidden>'+LI.map(function(x){return pcard(x,'LinkedIn');}).join('')+'</div></section>';
    }

    /* 5. Calendrier */
    var C=D.calendrier, n=days(C.debut,C.fin)+1, start=d(C.debut);
    var cols='120px repeat('+n+',minmax(26px,1fr))';
    function col(iso){return days(C.debut,iso)+2;}
    function inR(iso){var k=days(C.debut,iso);return k>=0&&k<n;}
    var g='<div class="cal-grid" style="grid-template-columns:'+cols+'"><div></div>';
    for(var i=0;i<n;i++){
      var x=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      var we=x.getDay()===0||x.getDay()===6, mon=x.getDay()===1;
      var lab=(i===0||x.getDate()===1)?MOIS[x.getMonth()]:JOURS[x.getDay()].charAt(0).toUpperCase();
      g+='<div class="cal-day'+(we?' we':'')+(mon?' mon':'')+'" style="grid-column:'+(i+2)+';grid-row:1">'+esc(lab)+'<b>'+x.getDate()+'</b></div>';
    }
    // Voie pubs : une ligne par campagne
    var row=2;
    g+='<div class="cal-lane" style="grid-row:'+row+'/'+(row+P.campagnes.length)+'">Pubs</div>';
    P.campagnes.forEach(function(c,ix){
      var a=Math.max(0,days(C.debut,c.debut)), b=Math.min(n-1,days(C.debut,c.fin));
      if(b<0||a>n-1)return;
      g+='<div class="ev pub'+(c.statut==="À venir"?' soon':'')+'" style="grid-row:'+(row+ix)+';grid-column:'+(a+2)+'/'+(b+3)+'" title="'+esc(c.nom+" · "+fd(c.debut)+" → "+fd(c.fin))+'">'+esc(c.calendrier||c.nom)+'</div>';
    });
    row+=P.campagnes.length;
    // Voie infolettres
    g+='<div class="cal-lane" style="grid-row:'+row+'">Infolettres</div>';
    N.prochains.filter(function(x){return inR(x.date);}).forEach(function(x){
      g+='<div class="ev nl" style="grid-row:'+row+';grid-column:'+col(x.date)+'" title="'+esc(fd(x.date)+" · "+x.nom)+'">✉</div>';
    });
    row++;
    // Voie formations (pastilles groupées par jour)
    g+='<div class="cal-lane" style="grid-row:'+row+'">Formations</div>';
    var byDay={};
    F.forEach(function(x){if(inR(x.date))(byDay[x.date]=byDay[x.date]||[]).push(x);});
    Object.keys(byDay).forEach(function(k){
      g+='<div class="fm" style="grid-row:'+row+';grid-column:'+col(k)+'">'+byDay[k].map(function(x){
        var lo=x.inscrits<=seuil;
        return '<i class="'+(lo?'lo':'')+'" title="'+esc(fd(x.date)+" · "+x.titre+" — "+x.inscrits+"/"+x.max)+'">'+x.inscrits+'</i>';
      }).join('')+'</div>';
    });
    g+='</div>';
    html+='<section id="calendrier"><div class="sh"><h2><span class="o">Calendrier</span></h2><span class="k">'+fd(C.debut)+' → '+fd(C.fin)+'</span></div>'+
      '<div class="card cal"><div class="cal-scroll">'+g+'</div><div class="cal-hint">← Glisser pour voir toute la période →</div>'+
      '<div class="legend"><span><i class="sw" style="background:var(--yel)"></i>Pub programmée</span><span><i class="sw" style="background:#f6d9a8;border:1px dashed var(--yel)"></i>Pub à venir</span><span><i class="sw" style="background:var(--indigo)"></i>Infolettre</span><span><i class="sw" style="background:var(--sage);border-radius:50%"></i>Formation (nb d’inscrits)</span><span><i class="sw" style="background:var(--red);border-radius:50%"></i>Non confirmée</span></div></div></section>';

    var som='<nav class="sommaire">'+[["aujourdhui","Aujourd’hui"],["strategie","Stratégie"],["ventes","Ventes"],["parcours","Parcours client"],["formations","Formations"],["pubs","Pubs"],["infolettres","Infolettres"],["toutes-infolettres","Toutes les infolettres"],["reseaux","Réseaux sociaux"],["calendrier","Calendrier"]]
      .filter(function(a){return html.indexOf('id="'+a[0]+'"')>=0;}).map(function(a){return '<a href="#'+a[0]+'">'+a[1]+'</a>';}).join('')+'</nav>';
    document.getElementById("app").innerHTML=som+html;
    window.__SH=D.shopify||null;
    if(D.ventes) window.vtInit(D.ventes,D.today);
    if(D.parcours){var pb=document.getElementById('pc-bars'),tg=document.querySelector('.pc-tog');
      var drawP=function(v){var L=D.parcours[v],mx=Math.max.apply(null,L.map(function(x){return x.commandes;}).concat([1])),tot=L.reduce(function(s,x){return s+x.commandes;},0);
        pb.innerHTML=L.map(function(x){return '<div class="pc-row"><b>'+esc(x.canal)+'</b><i style="width:'+(100*x.commandes/mx)+'%"></i><span>'+int(x.commandes)+' cmd · '+Math.round(100*x.commandes/(tot||1))+' % · '+money(x.ht)+'</span></div>';}).join('');};
      tg.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});drawP(b.dataset.v);});
      drawP('derniereVisite');}
    if(D.googleAds&&D.googleAds.roi){var RO=D.googleAds.roi,ro=document.getElementById('roi-o'),rt=document.querySelector('.roi-t');
      var drawR=function(i){var p=RO.periodes[i],prof=p.ventesNettes*RO.marge,reste=prof-p.depense,f=RO.fraisHamak;
        var t=function(k,v,s,c){return '<div class="roi-c'+(c?' '+c:'')+'"><span class="k">'+k+'</span><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';};
        ro.innerHTML='<div class="roi-g">'+
          t('1 · Payé à Google',money(p.depense),'du '+fd(p.du)+' au '+fd(p.au))+
          t('2 · Vraies ventes',money(p.ventesNettes),'<b>'+p.commandes+' commandes</b> venues d’une pub Google (Shopify, avant taxes)')+
          t('3 · Profit sur ces ventes',money(prof),Math.round(RO.marge*100)+' % de marge après le coût des formateurs')+
          t('4 · Il reste',money(reste),f!=null?('après les frais de Hamak ('+money(f)+') : <b>'+money(reste-f)+'</b>'):'avant les frais de gestion de Hamak (montant à ajouter)',reste>0?'ok':'ko')+'</div>'+
          '<div class="roi-l"><span>Coût pour 1 vente : <b>'+money(p.depense/(p.commandes||1))+'</b></span><span>Chaque 1 $ payé à Google ramène <b>'+(p.ventesNettes/p.depense).toFixed(2).replace('.',',')+' $</b> de ventes</span>'+
          '<span>Google dit <b>'+String(p.googleConv).replace('.',',')+' conversions</b>; Shopify a vraiment enregistré <b>'+p.commandes+' ventes</b></span></div>';};
      rt.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;rt.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});drawR(+b.dataset.r);});drawR(0);}
    if(D.ventesCanaux){var VC=D.ventesCanaux,vo=document.getElementById('vc-o'),vt=document.querySelector('.vc-t');
      var drawV=function(i){var P=VC.periodes[i],mx=Math.max.apply(null,P.canaux.map(function(c){return c.ventes;}));
        vo.innerHTML='<p class="vc-s"><b>'+int(P.total.commandes)+' ventes · '+money(P.total.ventes)+'</b> avant taxes, du '+fd(P.du)+' au '+fd(P.au)+'</p><table class="cr-t vc-b"><tr><th>Canal</th><th></th><th>Ventes</th><th>Montant</th><th>Payé</th><th>Pour 1 $ payé</th></tr>'+
          P.canaux.map(function(c){return '<tr'+(c.paye!=null?' class="vc-p"':'')+'><td><b>'+esc(c.canal)+'</b></td><td class="vc-bar"><i style="width:'+(100*c.ventes/mx)+'%"></i></td><td>'+int(c.commandes)+'</td><td><b>'+money(c.ventes)+'</b></td><td>'+(c.paye!=null?money(c.paye):'—')+'</td><td>'+(c.paye?(c.ventes/c.paye).toFixed(2).replace('.',',')+' $':'—')+'</td></tr>';}).join('')+'</table>';};
      vt.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;vt.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});drawV(+b.dataset.i);});drawV(0);}
    window.fraicheur(D);
    document.querySelectorAll(".tabs:not(.vt-per):not(.pc-tog):not(.roi-t):not(.vc-t)").forEach(function(tb){
      tb.addEventListener("click",function(e){
        var b=e.target.closest("button"); if(!b)return;
        tb.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);document.getElementById(x.dataset.t).hidden=(x!==b);});
      });
    });
  }
})();

document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.nlbig');
  var L=document.getElementById('lbx');
  if(b){
    if(!L){L=document.createElement('div');L.id='lbx';L.className='lbx';L.innerHTML='<button class="x" type="button" aria-label="Fermer">×</button><div class="pn"></div>';document.body.appendChild(L);}

window.vtInit=function(V,todayIso){
  var MO=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  function P(iso){var a=iso.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
  function I(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function $(n){return Math.round(n).toLocaleString("fr-CA")+" $";}
  function fd(iso){var d=P(iso);return d.getDate()+(d.getDate()===1?"er":"")+" "+MO[d.getMonth()];}
  function e(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var T=P(todayIso), out=document.getElementById("vt-out");
  function range(p){
    var d=new Date(T),a,b;
    if(p==="sem"||p==="sem-1"){var w=(d.getDay()+6)%7;a=new Date(d);a.setDate(d.getDate()-w);if(p==="sem-1")a.setDate(a.getDate()-7);b=new Date(a);b.setDate(a.getDate()+6);}
    else if(p==="mois"){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0);}
    else if(p==="mois-1"){a=new Date(d.getFullYear(),d.getMonth()-1,1);b=new Date(d.getFullYear(),d.getMonth(),0);}
    else if(p==="annee"){a=new Date(2026,0,1);b=new Date(2026,11,31);}
    else{a=P(document.getElementById("vt-du").value||I(T));b=P(document.getElementById("vt-au").value||I(T));}
    return [I(a),I(b)];
  }
  function budgetFor(a,b){ // budget au prorata des jours de chaque mois couvert
    var s=0,d=P(a),end=P(b);
    while(d<=end){var m=d.getMonth(),dim=new Date(d.getFullYear(),m+1,0).getDate();s+=(V.budgetMensuel[m]||0)/dim;d.setDate(d.getDate()+1);}
    return s;
  }
  function draw(p){
    var r=range(p),a=r[0],b=r[1];
    var L=V.lignes.filter(function(x){return x.date>=a&&x.date<=b;});
    var rev=L.reduce(function(s,x){return s+x.revenus;},0), pro=L.reduce(function(s,x){return s+x.profit;},0),
        par=L.reduce(function(s,x){return s+x.participants;},0), fut=L.filter(function(x){return x.date>todayIso;}).length;
    var bud=budgetFor(a,b), pct=bud?Math.round(100*rev/bud):null;
    var k='<div class="vt-kpis">'+
      '<div class="card"><span class="k">Revenus (formations données)</span><div class="v">'+$(rev)+'</div><span class="s">'+fd(a)+' → '+fd(b)+' · selon la date de la formation</span></div>'+
      '<div class="card"><span class="k">Vs budget</span><div class="v">'+(pct==null?"—":pct+" %")+'</div><span class="s">Budget de la période : '+$(bud)+' (au prorata des jours)</span></div>'+
      '<div class="card"><span class="k">Profit</span><div class="v">'+$(pro)+'</div><span class="s">'+(rev?Math.round(100*pro/rev)+" % de marge":"—")+'</span></div>'+
      (window.__SH?(function(){var J=window.__SH.jours.filter(function(x){return x.date>=a&&x.date<=b;});var ht=J.reduce(function(s,x){return s+x.ht;},0),nc=J.reduce(function(s,x){return s+x.commandes;},0);
        return '<div class="card"><span class="k">Encaissé (Shopify)</span><div class="v">'+$(ht)+'</div><span class="s">Avant taxes · '+nc+' commande'+(nc>1?'s':'')+' payée'+(nc>1?'s':'')+' dans la période</span></div>';})():'')+
      '<div class="card"><span class="k">Participants</span><div class="v">'+par+'</div><span class="s">'+L.length+' formation'+(L.length>1?"s":"")+(fut?' · dont '+fut+' à venir':'')+'</span></div></div>';
    var mx=Math.max.apply(null,V.budgetMensuel.concat(V.reelMensuel)), cm=T.getMonth();
    var bars='<div class="vt-bars">'+V.budgetMensuel.map(function(bv,i){var rv=V.reelMensuel[i]||0;
      return '<div class="vt-m'+(i===cm?' cur':'')+'"><i class="b" style="height:'+(100*bv/mx)+'%"></i><i class="r" style="height:'+(100*rv/mx)+'%"></i>'+
      '<span class="vt-tip">'+MO[i]+' : '+$(rv)+' / budget '+$(bv)+'</span></div>';}).join('')+'</div>'+
      '<div class="vt-lab">'+MO.map(function(m){return '<span>'+m.replace(".","")+'</span>';}).join('')+'</div>';
    var ytd=V.reelMensuel.reduce(function(s,x){return s+x;},0);
    var chart='<div class="card vt-chart"><span class="k">2026 par mois · réel vs budget</span>'+bars+
      '<div class="legend"><span><i class="sw" style="background:var(--yel)"></i>Réel</span><span><i class="sw" style="background:#e7e1d6"></i>Budget</span><span><i class="sw" style="background:#111"></i>Mois en cours</span></div>'+
      '<p class="s" style="margin:8px 0 0;font-size:13px">Cumul 2026 : <b>'+$(ytd)+'</b> sur '+$(V.budgetAnnuel)+' de budget (<b>'+(Math.round(1000*ytd/V.budgetAnnuel)/10).toLocaleString('fr-CA')+' %</b>).</p></div>';
    var list='<div class="card vt-list">'+(L.length?'<table>'+L.slice().sort(function(x,y){return x.date<y.date?-1:1;}).map(function(x){
      return '<tr><td>'+fd(x.date)+'</td><td>'+e(x.titre)+'<br><span class="s" style="font-size:12px;color:var(--mut)">'+x.participants+' participant'+(x.participants>1?"s":"")+'</span></td><td class="r">'+$(x.revenus)+'</td></tr>';}).join('')+'</table>':'<p class="vt-empty">Aucune formation dans cette période.</p>')+'</div>';
    out.innerHTML=k+'<div class="vt-grid">'+chart+list+'</div>';
  }
  var bar=document.querySelector(".vt-per"), per=document.querySelector(".vt-perso");
  bar.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;bar.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});per.hidden=b.dataset.p!=="perso";draw(b.dataset.p);});
  ["vt-du","vt-au"].forEach(function(id){document.getElementById(id).addEventListener("change",function(){draw("perso");});});
  draw("mois");
};

window.fraicheur=function(D){
  var Fr=D.fraicheur||{}, now=new Date();
  Object.keys(Fr).forEach(function(id){
    var f=Fr[id], sec=document.getElementById(id); if(!sec)return; var sh=sec.querySelector('.sh'); if(!sh)return;
    var q=f.mode==='auto'?(f.src==='shopify'?(D.shopify&&D.shopify.releve):f.src==='meta'?(D.meta&&D.meta.releve):f.src==='parcours'?((D.parcours||D.ga4||D.gsc||{}).releve):(D.infolettres&&D.infolettres.releve)):f.quand; var t=q?new Date(q):null;
    var h=t?(now-t)/36e5:999, lim=f.mode==='auto'?2:24, ok=h<=lim;
    var ago=!t?'—':h<1?'il y a '+Math.max(1,Math.round(h*60))+' min':h<24?'il y a '+Math.round(h)+' h':'le '+t.getDate()+' '+["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."][t.getMonth()]+' à '+t.getHours()+' h';
    var b=document.createElement('div'); b.className='fr '+(ok?'ok':'old');
    b.innerHTML='<span class="fr-d"></span><b>'+(f.mode==='auto'?'Connecté · mise à jour automatique':'Relevé manuel')+'</b> · '+ago+' · '+f.source+(ok?'':' · <i>à rafraîchir</i>');
    sh.insertAdjacentElement('afterend',b);
  });
};
