<!doctype html>
<!--
  OS Marketing Contech — tableau de bord (version 1)
  ===================================================
  Toutes les données affichées viennent de data.json (même dossier). Pour mettre à jour
  le tableau de bord, on modifie seulement data.json : le HTML ne change pas.

  Champs de data.json :
  - updated            Date/heure ISO du dernier relevé (affichée dans le pied de page).
  - today              Date ISO de référence (« aujourd'hui ») pour les tuiles et la frise.
  - seuilConfirmation  Nombre d'inscrits au-dessous ou égal duquel une formation est « non confirmée » (rouge).
  - kpis.achats        { valeur, periode, source, dernierRecu, qualiteCorrespondance } — achats suivis par le pixel Meta.
  - kpis.depensePubs[] { label, parJour ($), depuis (date ISO) } — dépenses quotidiennes des pubs actives/programmées.
  - formations         { source, releve, items[] }
      items[] = { date (ISO), titre, formateur, inscrits, max }
      Les « places à combler » = somme de (max − inscrits) sur toutes les formations listées.
  - pubs.campagnes[]   { nom, statut ("Programmée" | "Active" | "À venir" | "Terminée"), debut, fin (ISO),
                         budgetJour ($/jour) ou budgetTotal ($), objectif, ensembles[] (noms),
                         pubs (texte), utm (texte), calendrier (libellé court affiché dans la frise) }
  - pubs.reference     { nom, periode, coutParAchat ($) } — campagne de comparaison.
  - infolettres.derniers[]  { date, nom, ouverture (%), clic (%) } — derniers envois Dialog Insight.
  - infolettres.base        { contacts, nouveaux7j }
  - infolettres.sept_jours  { livraison, ouverture, clics, ctor, desabonnements } (en %)
  - infolettres.prochains[] { date, nom, statut } — le premier envoi futur alimente la tuile « Prochain envoi ».
  - calendrier         { debut, fin } — bornes (ISO) de la frise ; elle combine pubs, infolettres à venir et formations.
  - note               Texte affiché dans le pied de page.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OS Marketing Contech</title>
<style>
@font-face{font-family:Machina;src:url(fonts/machina-bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Helv;src:url(fonts/helvetica.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Helv;src:url(fonts/helvetica-bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --cream:#F7F3ED;--grid:rgb(233,230,223);--ink:#111;--yel:#E8990F;
  --blue:#86B8CE;--indigo:#5B618A;--sage:#86A397;--pink:#EF798A;--red:#B9314F;
  --mut:#5f5a52;--line:#e2dcd1;--card:#fff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.5 Helv,Helvetica,Arial,sans-serif;
  background-color:var(--cream);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:54px 54px}
.w{max-width:1160px;margin:0 auto;padding:28px 24px 56px}
h1,h2,h3{font-family:Machina,Helv,Helvetica,sans-serif;font-weight:700;margin:0;line-height:1.08;letter-spacing:-.01em}
.k{font:700 11px/1.3 Helv,Helvetica,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.o{color:var(--yel)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:34px}
header img{height:38px;width:auto;display:block;margin-bottom:18px}
header h1{font-size:clamp(30px,5vw,52px)}
.hdr-r{text-align:right}
.hdr-r .d{font-family:Machina,Helv,sans-serif;font-size:20px;margin-top:4px}

/* Sections */
section{margin-bottom:44px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sh h2{font-size:clamp(24px,3.2vw,32px)}
.sh .k{max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px}
.band{height:6px;background:var(--yel);border-radius:4px 4px 0 0}

/* Tuiles KPI */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .v{font-family:Machina,Helv,sans-serif;font-size:clamp(34px,4vw,46px);line-height:1}
.tile .v small{font-size:.45em;margin-left:4px}
.tile .s{font-size:13px;color:var(--mut);line-height:1.45}
.tile .s b{color:var(--ink)}
.pill{display:inline-block;font:700 10.5px/1 Helv,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 8px;border-radius:99px;background:#f1ece3;color:var(--ink);white-space:nowrap;max-width:100%}
.tile .pill{white-space:normal;line-height:1.25}
.tile .row{display:flex;flex-wrap:wrap;gap:6px}
.pill.y{background:var(--yel);color:#111}
.pill.r{background:var(--red);color:#fff}
.pill.b{background:var(--blue);color:#111}
.pill.i{background:var(--indigo);color:#fff}
.pill.g{background:var(--sage);color:#111}

/* Tableau formations */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .dt{white-space:nowrap;font-family:Machina,Helv,sans-serif;font-size:15px;width:92px}
.tbl .ti{font-weight:700;line-height:1.35}
.tbl .fo{color:var(--mut);font-size:13.5px}
.fill{display:flex;align-items:center;gap:10px;min-width:180px}
.bar{flex:1;height:8px;background:#efe9df;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar i.lo{background:var(--red)}
.fill .n{font-size:13.5px;white-space:nowrap;min-width:46px;text-align:right}
.fill .n.lo{color:var(--red);font-weight:700}
.tag-nc{font:700 10px/1 Helv;letter-spacing:.12em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Pubs */
.ads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ad{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ad h3{font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.ad .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.ad dt{color:var(--mut)}
.ad dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ad code{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#f4efe6;padding:2px 6px;border-radius:3px;overflow-wrap:anywhere}
.ad.soon{background:transparent;border-style:dashed;border-color:#cfc6b6}
.ref{margin-top:16px;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ref .v{font-family:Machina,Helv,sans-serif;font-size:26px}

/* Infolettres */
.nl{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.nl-list{padding:6px 0}
.nl-row{display:grid;grid-template-columns:70px minmax(0,1fr) 170px;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.nl-row:last-child{border-bottom:0}
.nl-row .dt{font-family:Machina,Helv,sans-serif;font-size:14px;white-space:nowrap}
.nl-row .nm{font-weight:700;line-height:1.35;min-width:0}
.rates{display:flex;flex-direction:column;gap:5px}
.rate{display:grid;grid-template-columns:34px 1fr 46px;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.rate .bar{height:6px}
.rate b{color:var(--ink);text-align:right;font-weight:700;white-space:nowrap}
.nl-grp{padding:14px 20px 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--mut);border-bottom:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .card{padding:18px 20px}
.big{font-family:Machina,Helv,sans-serif;font-size:36px;line-height:1;margin:8px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;margin-top:12px}
.stats div{text-align:left;min-width:0}
.stats .v{font-family:Machina,Helv,sans-serif;font-size:19px;line-height:1.1;white-space:nowrap}
.stats .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.next li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
.next ul{list-style:none;margin:8px 0 0;padding:0}
.next .dt{font-family:Machina,Helv,sans-serif;font-size:14px;min-width:62px;white-space:nowrap}
.next .nm{flex:1;font-weight:700;min-width:0}

/* Calendrier */
.cal{padding:18px 20px 16px}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.cal-grid{display:grid;position:relative;min-width:860px;row-gap:6px}
.cal-day{font-size:11px;text-align:center;color:var(--mut);padding:4px 0 6px;border-left:1px solid var(--line);line-height:1.2}
.cal-day b{display:block;font-family:Machina,Helv,sans-serif;font-size:14px;color:var(--ink)}
.cal-day.we{background:#faf7f2}
.cal-day.mon{border-left:2px solid var(--ink)}
.cal-lane{font:700 10.5px/1.2 Helv;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;padding-right:10px}
.ev{border-radius:3px;font-size:11.5px;font-weight:700;line-height:1.2;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;align-self:center}
.ev.pub{background:var(--yel);color:#111}
.ev.pub.soon{background:repeating-linear-gradient(135deg,#f6d9a8 0 6px,#f9e6c4 6px 12px);color:#111;border:1px dashed var(--yel)}
.ev.nl{background:var(--indigo);color:#fff;text-align:center;padding:6px 2px}
.fm{display:flex;flex-direction:column;gap:3px;align-items:center;align-self:start;padding-top:2px}
.fm i{width:22px;height:22px;border-radius:50%;background:var(--sage);color:#111;font:700 10px/22px Helv;text-align:center;font-style:normal;cursor:default}
.fm i.lo{background:var(--red);color:#fff}
.cal-today{font:700 10px/1 Helv;letter-spacing:.1em;text-transform:uppercase}
.cal-hint{display:none;font-size:12px;color:var(--mut);margin-top:6px}


/* Galeries (infolettres, réseaux sociaux) */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{font:700 14px Helv,sans-serif;padding:9px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gal[hidden]{display:none}
.vt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.vt-perso label{font-size:13px;color:var(--mut)}
.vt-perso input{font:14px Helv,sans-serif;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
.vt-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.vt-kpis .card{padding:14px 16px}
.vt-kpis .v{font:700 28px/1.1 Machina,Helv,sans-serif;margin:6px 0 4px}
.vt-kpis .s{font-size:12.5px;color:var(--mut)}
.vt-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media(max-width:860px){.vt-grid{grid-template-columns:1fr}}
.vt-chart{padding:16px}
.vt-bars{display:flex;align-items:flex-end;gap:6px;height:190px;border-bottom:1px solid var(--line);padding-top:8px}
.vt-m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative;cursor:default}
.vt-m i{display:block;width:42%;border-radius:3px 3px 0 0}
.vt-m i.b{background:#e7e1d6}
.vt-m i.r{background:var(--yel)}
.vt-m.cur i.r{background:#111}
.vt-lab{display:flex;gap:6px;margin-top:6px}
.vt-lab span{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.vt-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;padding:6px 8px;border-radius:4px;white-space:nowrap;display:none;z-index:3;margin-bottom:6px}
.vt-m:hover .vt-tip{display:block}
.vt-list{padding:6px 0;max-height:300px;overflow:auto}
.vt-list table{width:100%;border-collapse:collapse;font-size:13.5px}
.vt-list td{padding:7px 14px;border-top:1px solid var(--line);vertical-align:top}
.vt-list td.r{text-align:right;white-space:nowrap}
.vt-list tr:first-child td{border-top:0}
.vt-list td:first-child{white-space:nowrap}
@media(max-width:480px){.vt-kpis .v{font-size:22px}}
#ventes .gnote{margin-top:10px}
.vt-empty{padding:16px;color:var(--mut);font-size:14px}
.gal.nlgal{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.gc.nl .bd{flex:0 0 auto}
.nlv{height:520px;overflow-y:auto;margin:0 14px;border:1px solid var(--line);border-radius:4px;background:#fff}
.nlv img{display:block;width:100%;height:auto}
.nlv iframe{display:block;width:100%;height:100%;border:0}
.nlwait{font-size:12.5px;color:var(--mut);padding:10px 12px;margin:0}
.nlbig{align-self:flex-start;margin:10px 14px 14px;background:none;border:0;padding:0;font:700 13px Helv,sans-serif;text-decoration:underline;cursor:pointer;color:var(--ink)}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.lbx[hidden]{display:none}
.lbx .pn{background:#fff;width:min(680px,100%);height:92vh;border-radius:6px;overflow:auto;position:relative}
.lbx .pn img{display:block;width:100%;height:auto}
.lbx .pn iframe{display:block;width:100%;height:100%;border:0}
.lbx .x{position:fixed;top:14px;right:18px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer;line-height:38px}
.gc{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gc .th{display:block;height:300px;overflow:hidden;background:#EFEFEF;border-bottom:1px solid var(--line)}
.gc .th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gc .th.sq{height:auto;aspect-ratio:1/1}
.gc .th .vide{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;color:var(--mut);padding:16px;text-align:center}
.gc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc .k{font-size:11px}
.gc h3{font:700 15px/1.3 Helv,sans-serif;margin:0}
.gc .st{font-size:13px;color:var(--mut)}
.gc .st b{color:var(--ink)}
.gc .lk{margin-top:auto;font-size:13px;font-weight:700;color:var(--ink)}
.gnote{font-size:13px;color:var(--mut);margin:0 0 12px}
.sommaire{display:flex;gap:8px;flex-wrap:wrap;margin:-14px 0 28px}
.sommaire a{font:700 13px Helv,sans-serif;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px}

footer{border-top:2px solid var(--ink);padding-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
footer b{color:var(--ink)}
.err{padding:20px;border:1px solid var(--red);color:var(--red);background:#fff}

@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ads{grid-template-columns:1fr 1fr}
  .nl{grid-template-columns:1fr}
}
@media (max-width:700px){
  .w{padding:20px 16px 40px}
  header{margin-bottom:26px}
  .hdr-r{text-align:left}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px}
  .tile .v{font-size:32px}
  .ads{grid-template-columns:1fr}
  /* Tableau -> cartes empilées */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:10px}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{padding:0;border:0}
  .tbl .dt{grid-row:1/3;width:auto;font-size:14px;padding-top:2px}
  .tbl td.fl{grid-column:2;margin-top:8px}
  .fill{min-width:0}
  .nl-row{grid-template-columns:56px minmax(0,1fr);padding:12px 16px}
  .nl-row .rates{grid-column:2}
  .cal{padding:14px 12px}
  .cal-hint{display:block}
}
@media (max-width:380px){ .tiles{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="w">
  <header>
    <div>
      <img src="logo.png" alt="Contech Bâtiment">
      <div class="k">Tableau de bord marketing</div>
      <h1>OS Marketing <span class="o">Contech</span></h1>
    </div>
    <div class="hdr-r">
      <div class="k">Aujourd'hui</div>
      <div class="d" id="today">—</div>
      <a href="memo.html" style="display:inline-block;margin-top:10px;font:700 13px Helv,sans-serif;color:#111;text-decoration:none;border:2px solid #111;padding:6px 12px;border-radius:999px;background:#fff">Lire le mémo du projet →</a>
    </div>
  </header>

  <main id="app"><p class="k">Chargement des données…</p></main>

  <footer>
    <div>Données mises à jour le <b id="updated">—</b></div>
    <div id="note"></div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var MOIS_L=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
  var JOURS_L=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function d(iso){var p=String(iso).slice(0,10).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function hm(iso){var m=String(iso).match(/T(\d\d):(\d\d)/);if(!m)return"";return (+m[1])+" h"+(m[2]==="00"?"":" "+m[2]);}
  function fd(iso){var x=d(iso);return x.getDate()+(x.getDate()===1?"er":"")+" "+MOIS[x.getMonth()];}
  function fdj(iso){var x=d(iso);return JOURS[x.getDay()]+" "+fd(iso);}
  function money(n){var s=(Math.round(n*100)/100).toFixed(n%1?2:0).replace(".",",");return s.replace(/\B(?=(\d{3})+(?!\d))/g," ")+" $";}
  function int(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
  function pct(n){return String(n).replace(".",",")+" %";}
  function days(a,b){return Math.round((d(b)-d(a))/864e5);}

  var SOC=null;
  fetch("social.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  .then(function(s){SOC=s;return fetch("data.json",{cache:"no-store"});})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(render).catch(function(e){
    document.getElementById("app").innerHTML='<div class="err">Impossible de charger data.json ('+esc(e.message)+').</div>';
  });

  function render(D){
    var seuil=D.seuilConfirmation==null?5:D.seuilConfirmation;
    D.today=(function(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');})();
    var t=d(D.today);
    document.getElementById("today").textContent=JOURS_L[t.getDay()]+" "+t.getDate()+" "+MOIS_L[t.getMonth()]+" "+t.getFullYear();
    var up=new Date(D.updated);
    document.getElementById("updated").textContent=isNaN(up)?D.updated:
      up.getDate()+" "+MOIS_L[up.getMonth()]+" "+up.getFullYear()+" à "+up.getHours()+" h"+(up.getMinutes()?" "+String(up.getMinutes()).padStart(2,"0"):"");
    document.getElementById("note").textContent=D.note||"";

window.vtInit=function(V,todayIso){
  var MO=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

  function fd(iso){var d=P(iso);return d.getDate()+(d.getDate()===1?"er":"")+" "+MO[d.getMonth()];}
  function e(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var T=P(todayIso), out=document.getElementById("vt-out");

    if(p==="sem"||p==="sem-1"){var w=(d.getDay()+6)%7;a=new Date(d);a.setDate(d.getDate()-w);if(p==="sem-1")a.setDate(a.getDate()-7);b=new Date(a);b.setDate(a.getDate()+6);}
    else if(p==="mois"){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0);}
    else if(p==="mois-1"){a=new Date(d.getFullYear(),d.getMonth()-1,1);b=new Date(d.getFullYear(),d.getMonth(),0);}
    else if(p==="annee"){a=new Date(2026,0,1);b=new Date(2026,11,31);}
    else{a=P(document.getElementById("vt-du").value||I(T));b=P(document.getElementById("vt-au").value||I(T));}
    return [I(a),I(b)];
  }
  function budgetFor(a,b){ // budget au prorata des jours de chaque mois couvert
    var s=0,d=P(a),end=P(b);
    while(d<=end){var m=d.getMonth(),dim=new Date(d.getFullYear(),m+1,0).getDate();s+=(V.budgetMensuel[m]||0)/dim;d.setDate(d.getDate()+1);}

  function draw(p){

        par=L.reduce(function(s,x){return s+x.participants;},0), fut=L.filter(function(x){return x.date>todayIso;}).length;
    var bud=budgetFor(a,b), pct=bud?Math.round(100*rev/bud):null;
    var k='<div class="vt-kpis">'+
      '<div class="card"><span class="k">Revenus</span><div class="v">'+$(rev)+'</div><span class="s">'+fd(a)+' → '+fd(b)+'</span></div>'+
      '<div class="card"><span class="k">Vs budget</span><div class="v">'+(pct==null?"—":pct+" %")+'</div><span class="s">Budget de la période : '+$(bud)+'</span></div>'+
      '<div class="card"><span class="k">Profit</span><div class="v">'+$(pro)+'</div><span class="s">'+(rev?Math.round(100*pro/rev)+" % de marge":"—")+'</span></div>'+
      '<div class="card"><span class="k">Participants</span><div class="v">'+par+'</div><span class="s">'+L.length+' formation'+(L.length>1?"s":"")+(fut?' · dont '+fut+' à venir':'')+'</span></div></div>';
    var mx=Math.max.apply(null,V.budgetMensuel.concat(V.reelMensuel)), cm=T.getMonth();
    var bars='<div class="vt-bars">'+V.budgetMensuel.map(function(bv,i){var rv=V.reelMensuel[i]||0;
      return '<div class="vt-m'+(i===cm?' cur':'')+'"><i class="b" style="height:'+(100*bv/mx)+'%"></i><i class="r" style="height:'+(100*rv/mx)+'%"></i>'+
      '<span class="vt-tip">'+MO[i]+' : '+$(rv)+' / budget '+$(bv)+'</span></div>';}).join('')+'</div>'+
      '<div class="vt-lab">'+MO.map(function(m){return '<span>'+m.replace(".","")+'</span>';}).join('')+'</div>';
    var ytd=V.reelMensuel.reduce(function(s,x){return s+x;},0);
    var chart='<div class="card vt-chart"><span class="k">2026 par mois · réel vs budget</span>'+bars+
      '<div class="legend"><span><i class="sw" style="background:var(--yel)"></i>Réel</span><span><i class="sw" style="background:#e7e1d6"></i>Budget</span><span><i class="sw" style="background:#111"></i>Mois en cours</span></div>'+
      '<p class="s" style="margin:8px 0 0;font-size:13px">Cumul 2026 : <b>'+$(ytd)+'</b> sur '+$(V.budgetAnnuel)+' de budget (<b>'+(Math.round(1000*ytd/V.budgetAnnuel)/10).toLocaleString('fr-CA')+' %</b>).</p></div>';
    var list='<div class="card vt-list">'+(L.length?'<table>'+L.slice().sort(function(x,y){return x.date<y.date?-1:1;}).map(function(x){
      return '<tr><td>'+fd(x.date)+'</td><td>'+e(x.titre)+'<br><span class="s" style="font-size:12px;color:var(--mut)">'+x.participants+' participant'+(x.participants>1?"s":"")+'</span></td><td class="r">'+$(x.revenus)+'</td></tr>';}).join('')+'</table>':'<p class="vt-empty">Aucune formation dans cette période.</p>')+'</div>';
    out.innerHTML=k+'<div class="vt-grid">'+chart+list+'</div>';
  }
  var bar=document.querySelector(".vt-per"), per=document.querySelector(".vt-perso");
  bar.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;bar.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});per.hidden=b.dataset.p!=="perso";draw(b.dataset.p);});
  ["vt-du","vt-au"].forEach(function(id){document.getElementById(id).addEventListener("change",function(){draw("perso");});});
  draw("mois");
};
</script>
</body>
</html>
